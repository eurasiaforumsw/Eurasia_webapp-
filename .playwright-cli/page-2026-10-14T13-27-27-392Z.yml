\"function\\\");\\n- }, []);\\n+ setCopied(false);\\n+ }, [path]);\\n \\n const trackShare = (platform: string) => {\\n if (!contentId) return;\" }, { \"sha\": \"0529cc88840e52c9426b26b32fdce2508921f1f4\", \"filename\": \"components/efsw/SiteNav.tsx\", \"status\": \"modified\", \"additions\": 8, \"deletions\": 2, \"changes\": 10, \"blob_url\": \"https://github.com/eurasiaforumsw/Eurasia_webapp-/blob/03564787af6901f8df04064b3c67c3440d306735/components%2Fefsw%2FSiteNav.tsx\", \"raw_url\": \"https://github.com/eurasiaforumsw/Eurasia_webapp-/raw/03564787af6901f8df04064b3c67c3440d306735/components%2Fefsw%2FSiteNav.tsx\", \"contents_url\": \"https://api.github.com/repos/eurasiaforumsw/Eurasia_webapp-/contents/components%2Fefsw%2FSiteNav.tsx?ref=03564787af6901f8df04064b3c67c3440d306735\", \"patch\": \"@@ -500,12 +500,18 @@ export function SiteNav() {\\n </span>\\n </header>\\n \\n- <div className=\\\"efsw-sheet\\\" id=\\\"efsw-mobile-menu\\\" data-open={sheetOpen}>\\n+ <div\\n+ className=\\\"efsw-sheet\\\"\\n+ id=\\\"efsw-mobile-menu\\\"\\n+ data-open={sheetOpen}\\n+ aria-hidden={!sheetOpen}\\n+ ref={(element) => { if (element) element.inert = !sheetOpen; }}\\n+ >\\n <div className=\\\"efsw-sheet__scrim\\\" role=\\\"presentation\\\" onClick={() => setSheetOpen(false)} />\\n <div\\n className=\\\"efsw-sheet__panel\\\"\\n role=\\\"dialog\\\"\\n- aria-modal=\\\"true\\\"\\n+ aria-modal={sheetOpen ? true : undefined}\\n aria-label={menuLabel}\\n data-lenis-prevent\\n >\" }, { \"sha\": \"d157eba52ed1c45609a3ff853e7850afd4a123b0\", \"filename\": \"lib/content-engagement.ts\", \"status\": \"modified\", \"additions\": 43, \"deletions\": 7, \"changes\": 50, \"blob_url\": \"https://github.com/eurasiaforumsw/Eurasia_webapp-/blob/03564787af6901f8df04064b3c67c3440d306735/lib%2Fcontent-engagement.ts\", \"raw_url\": \"https://github.com/eurasiaforumsw/Eurasia_webapp-/raw/03564787af6901f8df04064b3c67c3440d306735/lib%2Fcontent-engagement.ts\", \"contents_url\": \"https://api.github.com/repos/eurasiaforumsw/Eurasia_webapp-/contents/lib%2Fcontent-engagement.ts?ref=03564787af6901f8df04064b3c67c3440d306735\", \"patch\": \"@@ -14,6 +14,8 @@ export type ContentEngagement = {\\n \\n type RemoteEngagement = Omit<ContentEngagement, \\\"likedBy\\\" | \\\"lastUpdated\\\"> & { liked: boolean };\\n const cache = new Map<string, ContentEngagement>();\\n+const versions = new Map<string, number>();\\n+const mutations = new Map<string, Promise<void>>();\\n let visitorId: string | undefined;\\n \\n function getVisitorId() {\\n@@ -48,16 +50,43 @@ export function getContentEngagement(contentId: string): ContentEngagement {\\n likedBy: [], lastUpdated: \\\"\\\" };\\n }\\n \\n+function nextVersion(contentId: string) {\\n+ const version = (versions.get(contentId) || 0) + 1;\\n+ versions.set(contentId, version);\\n+ return version;\\n+}\\n+\\n+async function read(ids: string[], signal?: AbortSignal): Promise<RemoteEngagement[]> {\\n+ const params = new URLSearchParams({ visitorId: getVisitorId() });\\n+ ids.forEach((id) => params.append(\\\"id\\\", id));\\n+ const data = await payload(await fetch(`/api/academic/engagement?${params}`, { cache: \\\"no-store\\\", signal }));\\n+ return data.items as RemoteEngagement[];\\n+}\\n+\\n export async function loadContentEngagement(ids: string[], signal?: AbortSignal): Promise<ContentEngagement[]> {\\n const items: ContentEngagement[] = [];\\n for (let offset = 0; offset < ids.length; offset += 100) {\\n- const params = new URLSearchParams({ ids: ids.slice(offset, offset + 100).join(\\\",\\\"), visitorId: getVisitorId() });\\n- const data = await payload(await fetch(`/api/academic/engagement?${params}`, { cache: \\\"no-store\\\", signal }));\\n- items.push(...(data.items as RemoteEngagement[]).map(remember));\\n+ const batch = ids.slice(offset, offset + 100);\\n+ const requests = new Map(batch.map((id) => [id, { version: nextVersion(id), pending: mutations.has(id) }]));\\n+ const data = await read(batch, signal);\\n+ items.push(...data.map((item) => {\\n+ const request = requests.get(item.contentId);\\n+ return request && !request.pending && !mutations.has(item.contentId)\\n+ && request.version === versions.get(item.contentId) ? remember(item) : getContentEngagement(item.contentId);\\n+ }));\\n }\\n return items;\\n }\\n \\n+function queueMutation<T>(contentId: string, action: () => Promise<T>): Promise<T> {\\n+ nextVersion(contentId);\\n+ const result = (mutations.get(contentId) || Promise.resolve()).then(action);\\n+ const settled = result.then(() => undefined, () => undefined);\\n+ mutations.set(contentId, settled);\\n+ void settled.then(() => { if (mutations.get(contentId) === settled) mutations.delete(contentId); });\\n+ return result;\\n+}\\n+\\n async function record(contentId: string, action: \\\"view\\\" | \\\"download\\\" | \\\"like\\\" | \\\"unlike\\\") {\\n const data = await payload(await fetch(\\\"/api/academic/engagement\\\", {\\n method: \\\"POST\\\", headers: { \\\"Content-Type\\\": \\\"application/json\\\" },\\n@@ -68,12 +97,19 @@ async function record(contentId: string, action: \\\"view\\\" | \\\"download\\\" | \\\"like\\\" |\\n return engagement;\\n }\\n \\n-export const incrementViewCount = (contentId: string) => record(contentId, \\\"view\\\");\\n-export const incrementDownloadCount = (contentId: string) => record(contentId, \\\"download\\\");\\n+export const incrementViewCount = (contentId: string) => queueMutation(contentId, () => record(contentId, \\\"view\\\"));\\n+export const incrementDownloadCount = (contentId: string) => queueMutation(contentId, () => record(contentId, \\\"download\\\"));\\n export const hasUserLiked = (contentId: string) => getContentEngagement(contentId).likedBy.includes(getVisitorId());\\n export async function toggleLike(contentId: string) {\\n- const engagement = await record(contentId, hasUserLiked(contentId) ? \\\"unlike\\\" : \\\"like\\\");\\n- return { liked: hasUserLiked(contentId), engagement };\\n+ return queueMutation(contentId, async () => {\\n+ if (!cache.has(contentId)) {\\n+ const [item] = await read([contentId]);\\n+ if (!item) throw new Error(\\\"Document statistics are unavailable\\\");\\n+ remember(item);\\n+ }\\n+ const engagement = await record(contentId, hasUserLiked(contentId) ? \\\"unlike\\\" : \\\"like\\\");\\n+ return { liked: engagement.likedBy.includes(getVisitorId()), engagement };\\n+ });\\n }\\n export const getAllEngagement = () => Array.from(cache.values());\\n export const clearEngagementData = () => cache.clear();\" }, { \"sha\": \"6821e60bd5edea13100d82cf31023d41c814d461\", \"filename\": \"scripts/academic-detail.test.cjs\", \"status\": \"modified\", \"additions\": 52, \"deletions\": 0, \"changes\": 52, \"blob_url\": \"https://github.com/eurasiaforumsw/Eurasia_webapp-/blob/03564787af6901f8df04064b3c67c3440d306735/scripts%2Facademic-detail.test.cjs\", \"raw_url\": \"https://github.com/eurasiaforumsw/Eurasia_webapp-/raw/03564787af6901f8df04064b3c67c3440d306735/scripts%2Facademic-detail.test.cjs\", \"contents_url\": \"https://api.github.com/repos/eurasiaforumsw/Eurasia_webapp-/contents/scripts%2Facademic-detail.test.cjs?ref=03564787af6901f8df04064b3c67c3440d306735\", \"patch\": \"@@ -113,6 +113,58 @@ test(\\\"metadata follows the persisted academic entry and its SEO fields\\\", async (\\n assert.equal(metadata.title, `${academic.seoTitle} | EFSW Academic Documents`);\\n assert.equal(metadata.description, academic.seoDescription);\\n assert.deepEqual(metadata.openGraph.images, [academic.ogImage]);\\n+ assert.deepEqual(metadata.twitter.images, [academic.ogImage]);\\n+});\\n+\\n+test(\\\"relative cover images resolve against the public site for social previews\\\", async () => {\\n+ const previousSiteUrl = process.env.NEXT_PUBLIC_SITE_URL;\\n+ items = [{ ...academic, ogImage: undefined, coverImage: \\\"/uploads/research-cover.webp\\\" }];\\n+ try {\\n+ for (const siteUrl of [\\\"https://documents.example.invalid\\\", undefined]) {\\n+ if (siteUrl) process.env.NEXT_PUBLIC_SITE_URL = siteUrl;\\n+ else delete process.env.NEXT_PUBLIC_SITE_URL;\\n+ const metadata = await page.generateMetadata({ params: { slug: academic.id } });\\n+ const origin = siteUrl || \\\"https://eurasiaforumsw.org\\\";\\n+ assert.equal(metadata.metadataBase.origin, origin);\\n+ assert.equal(new URL(metadata.openGraph.images[0], metadata.metadataBase).href, `${origin}/uploads/research-cover.webp`);\\n+ assert.equal(new URL(metadata.twitter.images[0], metadata.metadataBase).href, `${origin}/uploads/research-cover.webp`);\\n+ }\\n+ } finally {\\n+ if (previousSiteUrl === undefined) delete process.env.NEXT_PUBLIC_SITE_URL;\\n+ else process.env.NEXT_PUBLIC_SITE_URL = previousSiteUrl;\\n+ }\\n+});\\n+\\n+test(\\\"direct document links resolve the matching record and share metadata keeps special IDs intact\\\", async () => {\\n+ const second = { ...academic, id: \\\"paper #2?ภาษาไทย/guide\\\", title: \\\"A different paper\\\", fileUrl: \\\"/second.pdf\\\" };\\n+ items = [academic, second];\\n+ const firstPage = await page.default({ params: { slug: academic.id } });\\n+ const secondPage = await page.default({ params: { slug: second.id } });\\n+ assert.equal(firstPage.props.seed.id, academic.id);\\n+ assert.equal(secondPage.props.seed.id, second.id);\\n+ assert.equal(secondPage.props.seed.title, second.title);\\n+ assert.equal(secondPage.props.seed.fileUrl, second.fileUrl);\\n+ assert.notEqual(firstPage.key, secondPage.key);\\n+\\n+ const previousSiteUrl = process.env.NEXT_PUBLIC_SITE_URL;\\n+ process.env.NEXT_PUBLIC_SITE_URL = \\\"https://documents.example.invalid\\\";\\n+ try {\\n+ const metadata = await page.generateMetadata({ params: { slug: second.id } });\\n+ const shared = new URL(metadata.openGraph.url);\\n+ assert.equal(shared.origin, \\\"https://documents.example.invalid\\\");\\n+ assert.equal(decodeURIComponent(shared.pathname.split(\\\"/\\\").at(-1)), second.id);\\n+ assert.equal(shared.search, \\\"\\\");\\n+ assert.equal(shared.hash, \\\"\\\");\\n+ assert.equal(metadata.alternates.canonical, shared.href);\\n+\\n+ items = [{ ...second, canonicalUrl: \\\"https://publisher.example.invalid/original\\\" }];\\n+ const original = await page.generateMetadata({ params: { slug: second.id } });\\n+ assert.equal(original.alternates.canonical, \\\"https://publisher.example.invalid/original\\\");\\n+ assert.equal(original.openGraph.url, shared.href);\\n+ } finally {\\n+ if (previousSiteUrl === undefined) delete process.env.NEXT_PUBLIC_SITE_URL;\\n+ else process.env.NEXT_PUBLIC_SITE_URL = previousSiteUrl;\\n+ }\\n });\\n \\n test(\\\"deleted or hidden records never fall back to bundled content\\\", async () => {\" }, { \"sha\": \"d4aa1c1fbddc4757bc591fbc4415717e0f43a191\", \"filename\": \"scripts/academic-reader-ui.test.cjs\", \"status\": \"added\", \"additions\": 187, \"deletions\": 0, \"changes\": 187, \"blob_url\": \"https://github.com/eurasiaforumsw/Eurasia_webapp-/blob/03564787af6901f8df04064b3c67c3440d306735/scripts%2Facademic-reader-ui.test.cjs\", \"raw_url\": \"https://github.com/eurasiaforumsw/Eurasia_webapp-/raw/03564787af6901f8df04064b3c67c3440d306735/scripts%2Facademic-reader-ui.test.cjs\", \"contents_url\": \"https://api.github.com/repos/eurasiaforumsw/Eurasia_webapp-/contents/scripts%2Facademic-reader-ui.test.cjs?ref=03564787af6901f8df04064b3c67c3440d306735\", \"patch\": \"@@ -0,0 +1,187 @@\\n+const assert = require('node:assert/strict');\\n+const { test, beforeEach, afterEach } = require('node:test');\\n+const fs = require('node:fs');\\n+const path = require('node:path');\\n+const Module = require('node:module');\\n+const ts = require('typescript');\\n+const root = path.resolve(__dirname, '..');\\n+const resolve = Module._resolveFilename;\\n+const load = Module._load;\\n+let harness;\\n+let cache;\\n+let viewRequest;\\n+let likeRequest;\\n+let related;\\n+let viewCalls;\\n+let likeCalls;\\n+let copiedLinks;\\n+const stubs = new Map();\\n+const blank = (id) => ({ contentId: id, viewCount: 0, downloadCount: 0, likeCount: 0, likedBy: [], lastUpdated: '' });\\n+const stats = (patch = {}) => ({ ...blank('paper'), viewCount: 23, likeCount: 5, likedBy: ['visitor'], ...patch });\\n+function stub(name) {\\n+ if (!stubs.has(name)) { const component = function Placeholder() {}; component.displayName = name; stubs.set(name, component); }\\n+ return stubs.get(name);\\n+}\\n+Module._resolveFilename = function (name, ...args) {\\n+ return resolve.call(this, name.startsWith('@/') ? path.join(root, name.slice(2)) : name, ...args);\\n+};\\n+Module._load = function (name, ...args) {\\n+ if (name === 'react') return {\\n+ ...load.call(this, name, ...args),\\n+ useState(initial) {\\n+ const index = harness.cursor++;\\n+ if (!(index in harness.state)) harness.state[index] = typeof initial === 'function' ? initial() : initial;\\n+ return [harness.state[index], (value) => { harness.state[index] = typeof value === 'function' ? value(harness.state[index]) : value; }];\\n+ },\\n+ useMemo: (factory) => factory(),\\n+ useEffect(effect, deps) {\\n+ const index = harness.effectCursor++;\\n+ const previous = harness.deps[index];\\n+ if (!previous || deps.some((value, i) => value !== previous[i])) {\\n+ harness.cleanup[index]?.();\\n+ harness.effects.push(() => { harness.cleanup[index] = effect(); });\\n+ harness.deps[index] = deps;\\n+ }\\n+ },\\n+ };\\n+ if (name === 'lucide-react') return new Proxy({}, { get: (_target, key) => key === '__esModule' ? true : stub(String(key)) });\\n+ if (name === 'next/link') return { __esModule: true, default: stub('Link') };\\n+ if (name === '@/contexts/I18nContext') return { useI18n: () => ({ t: (key) => key }) };\\n+ if (name === '@/hooks/useTranslatedFields') return { useTranslatedFields: () => ({ state: 'idle' }) };\\n+ if (name === '@/lib/admin-data') return { getAdminContent: () => [], getPublishedContentBySlug: () => null, getRelatedContent: () => [], ADMIN_CONTENT_KEY: 'content' };\\n+ if (name === '@/lib/member-auth') return { getSessionMember: () => null };\\n+ if (name === '@/lib/content-engagement') return {\\n+ getContentEngagement: (id) => cache.get(id) || blank(id),\\n+ hasUserLiked: (id) => Boolean(cache.get(id)?.likedBy.length),\\n+ incrementViewCount: async (id) => { viewCalls.push(id); const result = await viewRequest(id); cache.set(id, result); return result; },\\n+ toggleLike: async (id) => { likeCalls.push(id); const result = await likeRequest(id); cache.set(id, result); return { engagement: result }; },\\n+ incrementDownloadCount: async (id) => cache.get(id) || blank(id),\\n+ };\\n+ if (name.startsWith('@/components/')) {\\n+ const namePart = name.split('/').at(-1);\\n+ if (namePart === 'EngagementRow') return { EngagementRow: stub('EngagementRow'), RecordView: stub('RecordView') };\\n+ return { __esModule: true, default: stub(namePart), [namePart]: stub(namePart), Button: stub('Button') };\\n+ }\\n+ return load.call(this, name, ...args);\\n+};\\n+for (const extension of ['.ts', '.tsx']) require.extensions[extension] = (module, filename) => module._compile(ts.transpileModule(fs.readFileSync(filename, 'utf8'), {\\n+ compilerOptions: { module: ts.ModuleKind.CommonJS, target: ts.ScriptTarget.ES2020, jsx: ts.JsxEmit.ReactJSX, esModuleInterop: true },\\n+}).outputText, filename);\\n+const ArticleView = require('../components/efsw/ArticleView.tsx').default;\\n+const ShareBar = require('../components/efsw/ShareBar.tsx').default;\\n+const seed = { id: 'paper', title: 'The matching paper', category: 'Research', summary: 'A saved summary', body: 'Full saved content.' };\\n+const readerProps = { kind: 'academic', slug: 'paper', seed, backHref: '/academic-documents', contentSource: 'public' };\\n+const globals = ['window', 'document', 'navigator', 'fetch', 'CSS'].map((name) => [name, Object.getOwnPropertyDescriptor(global, name)]);\\n+function initialize() {\\n+ harness?.cleanup.forEach((cleanup) => cleanup?.());\\n+ harness = { cursor: 0, state: [], effectCursor: 0, deps: [], cleanup: [], effects: [] };\\n+}\\n+function render(Component, props) { harness.cursor = 0; harness.effectCursor = 0; return Component(props); }\\n+async function effects() { harness.effects.splice(0).forEach((effect) => effect()); await new Promise(setImmediate); await new Promise(setImmediate); }\\n+function all(tree) { if (Array.isArray(tree)) return tree.flatMap(all); return tree && typeof tree === 'object' ? [tree, ...all(tree.props?.children)] : []; }\\n+function text(tree) { if (Array.isArray(tree)) return tree.map(text).join(' '); if (tree && typeof tree === 'object') return text(tree.props?.children); return typeof tree === 'string' || typeof tree === 'number' ? String(tree) : ''; }\\n+function likeButton(tree) { return all(tree).find((node) => node.type === 'button' && /^(?:Unlike|Like) document$/.test(node.props?.['aria-label'])); }\\n+beforeEach(() => {\\n+ initialize(); cache = new Map(); related = []; viewCalls = []; likeCalls = []; copiedLinks = [];\\n+ viewRequest = async () => stats(); likeRequest = async () => stats({ likeCount: 4, likedBy: [] });\\n+ global.window = { location: { origin: 'https://reader.example.invalid', href: 'https://reader.example.invalid/academic-documents/paper' },\\n+ addEventListener() {}, removeEventListener() {}, setTimeout: () => 1, clearTimeout() {} };\\n+ global.document = { documentElement: { style: { setProperty() {} } } };\\n+ Object.defineProperty(global, 'navigator', { configurable: true, value: { clipboard: { writeText: async (url) => copiedLinks.push(url) } } });\\n+ global.CSS = { supports: () => true };\\n+ global.fetch = async (url) => Response.json(url === '/api/content/public' ? { items: related } : { images: [] });\\n+});\\n+afterEach(() => {\\n+ harness.cleanup.forEach((cleanup) => cleanup?.());\\n+ harness = null;\\n+ for (const [name, descriptor] of globals) {\\n+ if (descriptor) Object.defineProperty(global, name, descriptor);\\n+ else delete global[name];\\n+ }\\n+});\\n+\\n+test('reader blocks a premature like and shows the persisted like/view state after recording this document view', async () => {\\n+ let resolveView;\\n+ viewRequest = () => new Promise((resolve) => { resolveView = resolve; });\\n+ let tree = render(ArticleView, readerProps);\\n+ assert.equal(likeButton(tree).props.disabled, true);\\n+ assert.equal(text(likeButton(tree)).trim(), '—');\\n+ likeButton(tree).props.onClick();\\n+ await effects();\\n+ assert.deepEqual(likeCalls, []);\\n+ assert.deepEqual(viewCalls, ['paper']);\\n+ resolveView(stats());\\n+ await new Promise(setImmediate);\\n+ tree = render(ArticleView, readerProps);\\n+ assert.equal(likeButton(tree).props.disabled, false);\\n+ assert.equal(likeButton(tree).props['aria-pressed'], true);\\n+ assert.equal(text(likeButton(tree)).trim(), '5');\\n+ assert.ok(all(tree).some((node) => node.props?.['aria-label'] === '23 views'));\\n+ assert.equal(all(tree).some((node) => node.type?.displayName === 'RecordView'), false);\\n+\\n+ likeButton(tree).props.onClick();\\n+ await new Promise(setImmediate);\\n+ tree = render(ArticleView, readerProps);\\n+ assert.deepEqual(likeCalls, ['paper']);\\n+ assert.equal(likeButton(tree).props['aria-pressed'], false);\\n+ assert.equal(text(likeButton(tree)).trim(), '4');\\n+});\\n+\\n+test('a failed initial statistics write keeps like disabled and retry recovers without a false zero total', async () => {\\n+ viewRequest = async () => { throw new Error('Database offline'); };\\n+ render(ArticleView, readerProps); await effects();\\n+ let tree = render(ArticleView, readerProps);\\n+ assert.equal(likeButton(tree).props.disabled, true);\\n+ assert.equal(text(likeButton(tree)).trim(), '—');\\n+ assert.match(text(tree), /Database offline/);\\n+ viewRequest = async () => stats();\\n+ all(tree).find((node) => node.type === 'button' && text(node) === 'Retry document statistics').props.onClick();\\n+ render(ArticleView, readerProps); await effects();\\n+ tree = render(ArticleView, readerProps);\\n+ assert.doesNotMatch(text(tree), /Database offline/);\\n+ assert.equal(likeButton(tree).props.disabled, false);\\n+ assert.equal(text(likeButton(tree)).trim(), '5');\\n+});\\n+\\n+test('failed unlike preserves confirmed counts and encoded related/share links open the saved document ID', async () => {\\n+ const specialId = 'paper #2?ภาษาไทย/guide';\\n+ related = [{ ...seed, id: specialId, title: 'Another document', kind: 'document' }];\\n+ const props = { ...readerProps, slug: specialId, seed: { ...seed, id: specialId } };\\n+ viewRequest = async () => stats({ contentId: specialId });\\n+ likeRequest = async () => { throw new Error('Like could not be saved'); };\\n+ render(ArticleView, props); await effects();\\n+ let tree = render(ArticleView, props);\\n+ for (const share of all(tree).filter((node) => node.type?.displayName === 'ShareBar')) {\\n+ assert.equal(share.props.path, `/academic-documents/${encodeURIComponent(specialId)}`);\\n+ }\\n+ // Related documents are selected from the public response, with their own ID.\\n+ initialize();\\n+ viewRequest = async () => stats();\\n+ render(ArticleView, readerProps); await effects();\\n+ tree = render(ArticleView, readerProps);\\n+ assert.ok(all(tree).some((node) => node.props?.className === 'efsw-article__related-card'\\n+ && node.props.href === `/academic-documents/${encodeURIComponent(specialId)}`));\\n+ likeButton(tree).props.onClick(); await new Promise(setImmediate);\\n+ tree = render(ArticleView, readerProps);\\n+ assert.equal(text(likeButton(tree)).trim(), '5');\\n+ assert.equal(likeButton(tree).props['aria-pressed'], true);\\n+ assert.match(text(tree), /Like could not be saved/);\\n+});\\n+\\n+test('share buttons and copied URLs update when navigation changes the supplied document path', async () => {\\n+ const first = { title: seed.title, path: '/academic-documents/paper' };\\n+ render(ShareBar, first); await effects();\\n+ let tree = render(ShareBar, first);\\n+ all(tree).find((node) => node.type === 'button' && node.props['aria-label'] === 'article.copyLink').props.onClick();\\n+ await new Promise(setImmediate);\\n+ const secondPath = `/academic-documents/${encodeURIComponent('paper #2?ภาษาไทย/guide')}`;\\n+ const second = { title: 'Another document', path: secondPath };\\n+ global.window.location.href = `https://reader.example.invalid${secondPath}?tracking=discarded#section`;\\n+ render(ShareBar, second); await effects();\\n+ tree = render(ShareBar, second);\\n+ const facebook = all(tree).find((node) => node.props?.className === 'efsw-share__button efsw-share__button--facebook');\\n+ assert.equal(new URL(facebook.props.href).searchParams.get('u'), `https://reader.example.invalid${secondPath}`);\\n+ all(tree).find((node) => node.type === 'button' && node.props['aria-label'] === 'article.copyLink').props.onClick();\\n+ await new Promise(setImmediate);\\n+ assert.deepEqual(copiedLinks, ['https://reader.example.invalid/academic-documents/paper', `https://reader.example.invalid${secondPath}`]);\\n+});\" }, { \"sha\": \"0cebb9472fbb1402b554b2b5f952a3939adb91f7\", \"filename\": \"scripts/admin-analytics.test.cjs\", \"status\": \"modified\", \"additions\": 29, \"deletions\": 0, \"changes\": 29, \"blob_url\": \"https://github.com/eurasiaforumsw/Eurasia_webapp-/blob/03564787af6901f8df04064b3c67c3440d306735/scripts%2Fadmin-analytics.test.cjs\", \"raw_url\": \"https://github.com/eurasiaforumsw/Eurasia_webapp-/raw/03564787af6901f8df04064b3c67c3440d306735/scripts%2Fadmin-analytics.test.cjs\", \"contents_url\": \"https://api.github.com/repos/eurasiaforumsw/Eurasia_webapp-/contents/scripts%2Fadmin-analytics.test.cjs?ref=03564787af6901f8df04064b3c67c3440d306735\", \"patch\": \"@@ -180,6 +180,35 @@ test('public activity supports slug IDs, deduplicates repeated views, and saves/\\n assert.equal((await (await send('unlike')).json()).item.likeCount, 0);\\n });\\n \\n+test('repeated ID parameters preserve punctuation and Unicode IDs with distinct persisted counts and likes', async () => {\\n+ const ids = ['paper,a', 'เอกสารไทย&?#/一', 'paper', 'a'];\\n+ const visitorId = 'visitor1234567890';\\n+ tables.content.push(...ids.filter((id) => id !== 'paper').map((id) => document(id)));\\n+ const send = (contentId, action) => activity.POST(request('/api/academic/engagement', { contentId, visitorId, action }));\\n+ await send(ids[0], 'view');\\n+ await send(ids[0], 'like');\\n+ await send(ids[1], 'view');\\n+ await send(ids[1], 'download');\\n+ const params = new URLSearchParams({ visitorId, ids: 'legacy' });\\n+ ids.forEach((id) => params.append('id', id));\\n+ const response = await activity.GET(request(`/api/academic/engagement?${params}`));\\n+ assert.equal(response.status, 200);\\n+ const { items } = await response.json();\\n+ assert.deepEqual(items.map((item) => item.contentId).sort(), [...ids].sort());\\n+ const byId = Object.fromEntries(items.map((item) => [item.contentId, item]));\\n+ assert.equal(byId[ids[0]].viewCount, 1);\\n+ assert.equal(byId[ids[0]].likeCount, 1);\\n+ assert.equal(byId[ids[0]].liked, true);\\n+ assert.equal(byId[ids[1]].viewCount, 1);\\n+ assert.equal(byId[ids[1]].downloadCount, 1);\\n+ assert.equal(byId[ids[1]].liked, false);\\n+ assert.equal(byId.paper.viewCount, 0);\\n+ assert.equal(byId.paper.liked, false);\\n+ assert.equal(byId.a.likeCount, 0);\\n+ const legacy = await (await activity.GET(request('/api/academic/engagement?ids=paper,legacy'))).json();\\n+ assert.deepEqual(legacy.items.map((item) => item.contentId).sort(), ['legacy', 'paper']);\\n+});\\n+\\n test('activity cannot expose/record hidden documents or download without attachment', async () => {\\n assert.equal((await activity.POST(request('/api/academic/engagement', { contentId: 'paper', visitorId: 'visitor1234567890', action: ['view'] }))).status, 400);\\n for (const patch of [{ status: 'draft' }, { publish_at: ago(-10) }, { expires_at: ago(1) }, { target_groups: ['private'] }, { kind: 'news' }]) {\" }, { \"sha\": \"882296fb00eaa753d0c5c670601b7357342db388\", \"filename\": \"scripts/admin-console-check.sql\", \"status\": \"modified\", \"additions\": 40, \"deletions\": 2, \"changes\": 42, \"blob_url\": \"https://github.com/eurasiaforumsw/Eurasia_webapp-/blob/03564787af6901f8df04064b3c67c3440d306735/scripts%2Fadmin-console-check.sql\", \"raw_url\": \"https://github.com/eurasiaforumsw/Eurasia_webapp-/raw/03564787af6901f8df04064b3c67c3440d306735/scripts%2Fadmin-console-check.sql\", \"contents_url\": \"https://api.github.com/repos/eurasiaforumsw/Eurasia_webapp-/contents/scripts%2Fadmin-console-check.sql?ref=03564787af6901f8df04064b3c67c3440d306735\", \"patch\": \"@@ -1,4 +1,4 @@\\n--- Read-only readiness check. Run after migrations 023-027 in the SQL editor.\\n+-- Read-only readiness check. Run after migrations 023-028 in the SQL editor.\\n WITH required(name) AS (VALUES\\n ('public.members'), ('public.content'), ('public.layout_config'),\\n ('public.site_settings'), ('public.email_campaigns'), ('public.campaign_recipients'),\\n@@ -14,13 +14,51 @@ WITH required(table_name, column_name) AS (VALUES\\n ('content', 'page_count'), ('members', 'review_note'), ('members', 'reviewed_at'),\\n ('members', 'target_groups'), ('email_campaigns', 'audience'),\\n ('email_campaigns', 'created_by_actor'), ('member_suspensions', 'reason_details'),\\n- ('member_suspensions', 'lifted_at'), ('member_suspensions', 'lifted_by')\\n+ ('member_suspensions', 'lifted_at'), ('member_suspensions', 'lifted_by'),\\n+ ('layout_config', 'id'), ('layout_config', 'config'),\\n+ ('layout_config', 'updated_at'), ('layout_config', 'updated_by')\\n )\\n SELECT r.table_name || '.' || r.column_name AS requirement,\\n EXISTS(SELECT 1 FROM information_schema.columns c WHERE c.table_schema = 'public'\\n AND c.table_name = r.table_name AND c.column_name = r.column_name) AS ready\\n FROM required r;\\n \\n+-- Layout can be read publicly; mutations must use the protected service API.\\n+WITH layout AS (SELECT to_regclass('public.layout_config') AS table_id),\\n+required(requirement, ready) AS (VALUES\\n+ ('layout_config public SELECT grant', (\\n+ SELECT table_id IS NOT NULL AND has_table_privilege('anon', table_id, 'SELECT')\\n+ AND has_table_privilege('authenticated', table_id, 'SELECT') FROM layout\\n+ )),\\n+ ('layout_config browser mutations revoked', (\\n+ SELECT table_id IS NOT NULL\\n+ AND NOT has_table_privilege('anon', table_id, 'INSERT, UPDATE, DELETE, TRUNCATE')\\n+ AND NOT has_table_privilege('authenticated', table_id, 'INSERT, UPDATE, DELETE, TRUNCATE')\\n+ FROM layout\\n+ )),\\n+ ('layout_config service-role writes', (\\n+ SELECT table_id IS NOT NULL\\n+ AND has_table_privilege('service_role', table_id, 'SELECT')\\n+ AND has_table_privilege('service_role', table_id, 'INSERT')\\n+ AND has_table_privilege('service_role', table_id, 'UPDATE') FROM layout\\n+ )),\\n+ ('layout_config row security enabled', EXISTS (\\n+ SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace\\n+ WHERE n.nspname = 'public' AND c.relname = 'layout_config' AND c.relrowsecurity\\n+ )),\\n+ ('layout_config public read policy', EXISTS (\\n+ SELECT 1 FROM pg_policies\\n+ WHERE schemaname = 'public' AND tablename = 'layout_config'\\n+ AND policyname = 'Public can view layout config' AND cmd = 'SELECT'\\n+ )),\\n+ ('layout_config.updated_by TEXT', EXISTS (\\n+ SELECT 1 FROM information_schema.columns\\n+ WHERE table_schema = 'public' AND table_name = 'layout_config'\\n+ AND column_name = 'updated_by' AND data_type = 'text'\\n+ ))\\n+)\\n+SELECT requirement, ready FROM required;\\n+\\n WITH required(name) AS (VALUES\\n ('public.claim_email_campaign(uuid)'),\\n ('public.edit_admin_announcement(uuid,text,text,text,text[])'),\" }, { \"sha\": \"22e5ae4ec1a6fd5d9db1fd44bb19169b16012508\", \"filename\": \"scripts/admin-layout-settings.test.cjs\", \"status\": \"modified\", \"additions\": 11, \"deletions\": 1, \"changes\": 12, \"blob_url\": \"https://github.com/eurasiaforumsw/Eurasia_webapp-/blob/03564787af6901f8df04064b3c67c3440d306735/scripts%2Fadmin-layout-settings.test.cjs\", \"raw_url\": \"https://github.com/eurasiaforumsw/Eurasia_webapp-/raw/03564787af6901f8df04064b3c67c3440d306735/scripts%2Fadmin-layout-settings.test.cjs\", \"contents_url\": \"https://api.github.com/repos/eurasiaforumsw/Eurasia_webapp-/contents/scripts%2Fadmin-layout-settings.test.cjs?ref=03564787af6901f8df04064b3c67c3440d306735\", \"patch\": \"@@ -10,10 +10,11 @@ const resolve = Module._resolveFilename;\\n const load = Module._load;\\n const writes = [];\\n let databaseError = null;\\n+let storedLayout = { config: {} };\\n const database = {\\n from(table) {\\n let payload;\\n- const result = () => ({ data: payload || { config: {} }, error: databaseError });\\n+ const result = () => ({ data: payload || storedLayout, error: databaseError });\\n const query = {\\n select() { return query; }, eq() { return query; },\\n upsert(value) { payload = value; writes.push({ table, value }); return query; },\\n@@ -91,6 +92,15 @@ test('layout and settings accept verified administrator cookie, member cookie an\\n }\\n });\\n \\n+test('a missing default layout row returns an empty config while a missing table remains a visible failure', async () => {\\n+ storedLayout = null;\\n+ assert.equal((await layout.GET()).status, 200);\\n+ assert.deepEqual(await (await layout.GET()).json(), { config: {} });\\n+ databaseError = { code: 'PGRST205', message: 'layout_config is absent from the schema cache' };\\n+ try { assert.equal((await layout.GET()).status, 500); }\\n+ finally { databaseError = null; storedLayout = { config: {} }; }\\n+});\\n+\\n test('forged cookies and content editor roles cannot write layout or settings directly', async () => {\\n for (const headers of [{}, { cookie: 'admin_token=forged' }, { cookie: `member_token=${await token('content-editor')}` }]) {\\n writes.length = 0;\" }, { \"sha\": \"07079f8bb2b136aff58c38e7302fe84899159fd8\", \"filename\": \"scripts/check-built-styles.cjs\", \"status\": \"added\", \"additions\": 177, \"deletions\": 0, \"changes\": 177, \"blob_url\": \"https://github.com/eurasiaforumsw/Eurasia_webapp-/blob/03564787af6901f8df04064b3c67c3440d306735/scripts%2Fcheck-built-styles.cjs\", \"raw_url\": \"https://github.com/eurasiaforumsw/Eurasia_webapp-/raw/03564787af6901f8df04064b3c67c3440d306735/scripts%2Fcheck-built-styles.cjs\", \"contents_url\": \"https://api.github.com/repos/eurasiaforumsw/Eurasia_webapp-/contents/scripts%2Fcheck-built-styles.cjs?ref=03564787af6901f8df04064b3c67c3440d306735\", \"patch\": \"@@ -0,0 +1,177 @@\\n+#!/usr/bin/env node\\n+// Run after `next build`: node scripts/check-built-styles.cjs [path/to/.next]\\n+// Client-reference manifests are generated JavaScript: use only our trusted builds.\\n+const fs = require('node:fs');\\n+const path = require('node:path');\\n+const vm = require('node:vm');\\n+const postcss = require('postcss');\\n+\\n+const routes = [\\n+ { route: '/', directory: '', key: '/page' },\\n+ { route: '/academic-documents', directory: 'academic-documents', key: '/academic-documents/page' },\\n+ { route: '/admin', directory: 'admin', key: '/admin/page' },\\n+];\\n+\\n+function canonicalSelector(selector) {\\n+ return selector.trim().replace(/\\\\s+/g, ' ')\\n+ .replace(/\\\\[([^\\\\]=]+)=[\\\"']([^\\\"']+)[\\\"']\\\\]/g, '[$1=$2]');\\n+}\\n+\\n+function baseDeclarations(trees) {\\n+ const selectors = new Map();\\n+ for (const tree of trees) {\\n+ tree.walkRules((rule) => {\\n+ // Do not let a mobile/reduced-motion override hide a missing base rule.\\n+ for (let parent = rule.parent; parent; parent = parent.parent) {\\n+ if (parent.type === 'atrule' && /^(?:media|supports|container|document|.*keyframes)$/i.test(parent.name)) return;\\n+ }\\n+ for (const selector of rule.selectors) {\\n+ const key = canonicalSelector(selector);\\n+ if (!selectors.has(key)) selectors.set(key, new Map());\\n+ for (const node of rule.nodes) {\\n+ if (node.type === 'decl') selectors.get(key).set(node.prop, node.value);\\n+ }\\n+ }\\n+ });\\n+ }\\n+ return selectors;\\n+}\\n+\\n+function checkBuiltStyles(buildDirectory) {\\n+ const buildPath = path.resolve(buildDirectory);\\n+ const parsedFiles = new Map();\\n+ let checks = 0;\\n+\\n+ for (const { route, directory, key } of routes) {\\n+ const manifestPath = path.join(buildPath, 'server', 'app', directory, 'page_client-reference-manifest.js');\\n+ const context = {};\\n+ if (!fs.existsSync(manifestPath)) throw new Error(`${route}: client-reference manifest missing: ${manifestPath}`);\\n+ vm.runInNewContext(fs.readFileSync(manifestPath, 'utf8'), context, { filename: manifestPath, timeout: 1000 });\\n+ const manifest = context.__RSC_MANIFEST?.[key];\\n+ if (!manifest?.entryCSSFiles || typeof manifest.entryCSSFiles !== 'object') {\\n+ throw new Error(`${route}: manifest is missing entryCSSFiles`);\\n+ }\\n+\\n+ const references = [];\\n+ for (const entries of Object.values(manifest.entryCSSFiles)) {\\n+ if (!Array.isArray(entries)) throw new Error(`${route}: invalid CSS manifest entries`);\\n+ for (const entry of entries) {\\n+ // Next 14 emits strings; newer Next versions may use { path, inlined }.\\n+ const reference = typeof entry === 'string' ? entry : entry?.path;\\n+ if (typeof reference !== 'string' || !/^static\\\\/[^?#]+\\\\.css$/.test(reference)) {\\n+ throw new Error(`${route}: invalid CSS reference in manifest`);\\n+ }\\n+ references.push(reference);\\n+ }\\n+ }\\n+ const files = [...new Set(references)];\\n+ if (!files.length) throw new Error(`${route}: manifest references no CSS files`);\\n+\\n+ const trees = files.map((reference) => {\\n+ const filename = path.resolve(buildPath, reference);\\n+ if (!filename.startsWith(buildPath + path.sep)) throw new Error(`${route}: CSS reference escapes build directory`);\\n+ if (!fs.existsSync(filename) || !fs.statSync(filename).isFile()) {\\n+ throw new Error(`${route}: referenced CSS missing: ${reference}`);\\n+ }\\n+ if (!parsedFiles.has(filename)) {\\n+ parsedFiles.set(filename, postcss.parse(fs.readFileSync(filename, 'utf8'), { from: filename }));\\n+ }\\n+ return parsedFiles.get(filename);\\n+ });\\n+ const declarations = baseDeclarations(trees);\\n+ const requireDeclaration = (selector, property, expected) => {\\n+ checks += 1;\\n+ const value = declarations.get(canonicalSelector(selector))?.get(property);\\n+ const matches = typeof expected === 'function' ? expected(value || '')\\n+ : expected instanceof RegExp ? expected.test(value || '')\\n+ : expected === undefined ? Boolean(value)\\n+ : value?.replace(/\\\\s+/g, '') === expected.replace(/\\\\s+/g, '');\\n+ if (!matches) {\\n+ throw new Error(`${route}: ${selector} requires ${property}${typeof expected === 'string' ? `: ${expected}` : ''}; found ${value ?? '(missing)'}`);\\n+ }\\n+ };\\n+\\n+ // Real shared layout utilities and theme colors used by RootLayout and UI.\\n+ requireDeclaration('body', 'margin', '0');\\n+ requireDeclaration('body', 'font-family', /var\\\\(--font-body\\\\)/);\\n+ requireDeclaration(':root', '--font-body');\\n+ for (const [selector, property, value] of [\\n+ ['.flex', 'display', 'flex'], ['.items-center', 'align-items', 'center'],\\n+ ['.p-6', 'padding', '1.5rem'], ['.overflow-hidden', 'overflow', 'hidden'],\\n+ ]) requireDeclaration(selector, property, value);\\n+ requireDeclaration('.bg-surface-deep', 'background-color', /var\\\\(--surface-deep\\\\)/);\\n+ requireDeclaration('.text-text-primary', 'color', /var\\\\(--text-primary\\\\)/);\\n+ for (const theme of ['dark', 'light']) {\\n+ for (const token of ['--surface-deep', '--surface-base', '--text-primary', '--text-secondary']) {\\n+ requireDeclaration(`html[data-theme=${theme}]`, token, /^\\\\d+(?:\\\\.\\\\d+)?\\\\s+\\\\d+(?:\\\\.\\\\d+)?\\\\s+\\\\d+(?:\\\\.\\\\d+)?$/);\\n+ }\\n+ }\\n+ requireDeclaration('.efsw-nav', 'position', 'sticky');\\n+ requireDeclaration('.efsw-nav', 'top', '0');\\n+ requireDeclaration('.efsw-nav', 'z-index', (value) => Number(value) > 0);\\n+\\n+ if (route === '/') {\\n+ requireDeclaration('.efsw-home', 'background', /var\\\\(--efsw-paper\\\\)/);\\n+ requireDeclaration('.efsw-home', 'color', /var\\\\(--efsw-ink\\\\)/);\\n+ for (const selector of ['.efsw-about-bridge__grid', '.efsw-home-news__grid', '.efsw-footer__top']) {\\n+ requireDeclaration(selector, 'display', 'grid');\\n+ requireDeclaration(selector, 'grid-template-columns');\\n+ }\\n+ } else if (route === '/academic-documents') {\\n+ requireDeclaration('.academic-library', 'background', /var\\\\(--academic-paper\\\\)/);\\n+ requireDeclaration('.academic-library', '--academic-paper');\\n+ requireDeclaration('.academic-grid', 'display', 'grid');\\n+ requireDeclaration('.academic-grid', 'grid-template-columns', 'repeat(3, minmax(0, 1fr))');\\n+ requireDeclaration('.academic-grid--list', 'grid-template-columns', '1fr');\\n+ requireDeclaration('.document-card', 'display', 'flex');\\n+ requireDeclaration('.sticky-filters', 'position', 'sticky');\\n+ requireDeclaration('.author-marquee__track', 'display', 'flex');\\n+ requireDeclaration('.author-marquee__track', 'animation', (value) => {\\n+ const duration = value.match(/(?:^|\\\\s)(\\\\d*\\\\.?\\\\d+)(?:ms|s)(?=\\\\s|$)/);\\n+ return /(?:^|\\\\s)academic-contributors-scroll(?:\\\\s|$)/.test(value)\\n+ && Boolean(duration && Number(duration[1]) > 0)\\n+ && /(?:^|\\\\s)infinite(?:\\\\s|$)/.test(value);\\n+ });\\n+ requireDeclaration('.author-marquee__avatar', 'width', '148px');\\n+ requireDeclaration('.author-marquee__avatar', 'height', '172px');\\n+ requireDeclaration('.author-marquee__name', 'display', '-webkit-box');\\n+ requireDeclaration('.author-marquee__name', '-webkit-line-clamp', '2');\\n+ requireDeclaration('.author-marquee__name', '-webkit-box-orient', 'vertical');\\n+ requireDeclaration('.author-marquee__name', 'overflow', 'hidden');\\n+ requireDeclaration('.author-marquee.is-paused .author-marquee__track', 'animation-play-state', 'paused');\\n+ if (!trees.some((tree) => {\\n+ let present = false;\\n+ tree.walkAtRules('keyframes', (rule) => {\\n+ if (rule.params !== 'academic-contributors-scroll') return;\\n+ rule.walkRules((step) => {\\n+ if (!step.selectors.some((selector) => selector === 'to' || selector === '100%')) return;\\n+ step.walkDecls('transform', (declaration) => {\\n+ if (declaration.value.replace(/\\\\s+/g, '') === 'translateX(-50%)') present = true;\\n+ });\\n+ });\\n+ });\\n+ return present;\\n+ })) throw new Error(`${route}: academic-contributors-scroll keyframes require to/100% transform: translateX(-50%)`);\\n+ } else {\\n+ requireDeclaration('.admin-layout', 'display', 'grid');\\n+ requireDeclaration('.admin-layout', 'grid-template-columns', '18rem 1fr');\\n+ requireDeclaration('.admin-main', 'display', 'flex');\\n+ requireDeclaration('.admin-main', 'min-width', '0');\\n+ requireDeclaration('.admin-content', 'width', '100%');\\n+ requireDeclaration('.efsw-admin-panel', 'background');\\n+ requireDeclaration('.efsw-admin-panel', 'border');\\n+ }\\n+ console.log(`Built styles OK: ${route} (${files.length} referenced CSS files)`);\\n+ }\\n+ console.log(`Built styles passed: ${routes.length} routes, ${parsedFiles.size} CSS files, ${checks} declaration checks.`);\\n+}\\n+\\n+if (require.main === module) {\\n+ try { checkBuiltStyles(process.argv[2] || '.next'); }\\n+ catch (error) {\\n+ console.error(`Built styles FAILED: ${error.message}`);\\n+ process.exitCode = 1;\\n+ }\\n+}\\n+\\n+module.exports = { checkBuiltStyles };\" }, { \"sha\": \"2e630bf487debf6139017e93abe9e1906c1fac35\", \"filename\": \"scripts/content-engagement.test.cjs\", \"status\": \"added\", \"additions\": 161, \"deletions\": 0, \"changes\": 161, \"blob_url\": \"https://github.com/eurasiaforumsw/Eurasia_webapp-/blob/03564787af6901f8df04064b3c67c3440d306735/scripts%2Fcontent-engagement.test.cjs\", \"raw_url\": \"https://github.com/eurasiaforumsw/Eurasia_webapp-/raw/03564787af6901f8df04064b3c67c3440d306735/scripts%2Fcontent-engagement.test.cjs\", \"contents_url\": \"https://api.github.com/repos/eurasiaforumsw/Eurasia_webapp-/contents/scripts%2Fcontent-engagement.test.cjs?ref=03564787af6901f8df04064b3c67c3440d306735\", \"patch\": \"@@ -0,0 +1,161 @@\\n+const assert = require('node:assert/strict');\\n+const { test, beforeEach, afterEach } = require('node:test');\\n+const fs = require('node:fs');\\n+const ts = require('typescript');\\n+\\n+require.extensions['.ts'] = (module, filename) => module._compile(ts.transpileModule(fs.readFileSync(filename, 'utf8'), {\\n+ compilerOptions: { module: ts.ModuleKind.CommonJS, target: ts.ScriptTarget.ES2020 },\\n+}).outputText, filename);\\n+\\n+const client = require('../lib/content-engagement.ts');\\n+const savedWindow = global.window;\\n+const savedFetch = global.fetch;\\n+const visitor = 'visitor1234567890';\\n+const stats = (contentId, extra = {}) => ({ contentId, viewCount: 0, downloadCount: 0, likeCount: 0, liked: false, ...extra });\\n+const tick = () => new Promise((resolve) => setImmediate(resolve));\\n+const deferred = () => {\\n+ let resolve;\\n+ const promise = new Promise((done) => { resolve = done; });\\n+ return { promise, resolve };\\n+};\\n+\\n+beforeEach(() => {\\n+ client.clearEngagementData();\\n+ global.window = { localStorage: { getItem: () => visitor, setItem() {} }, dispatchEvent() {} };\\n+});\\n+afterEach(() => {\\n+ global.window = savedWindow;\\n+ global.fetch = savedFetch;\\n+});\\n+\\n+test('an uncached toggle reads a persisted like before choosing unlike', async () => {\\n+ const contentId = 'paper,a';\\n+ const calls = [];\\n+ global.fetch = async (url, options) => {\\n+ calls.push(options?.method || 'GET');\\n+ if (options?.method !== 'POST') {\\n+ assert.deepEqual(new URL(url, 'http://localhost').searchParams.getAll('id'), [contentId]);\\n+ return Response.json({ items: [stats(contentId, { liked: true, likeCount: 1 })] });\\n+ }\\n+ assert.equal(JSON.parse(options.body).contentId, contentId);\\n+ assert.equal(JSON.parse(options.body).action, 'unlike');\\n+ return Response.json({ item: stats(contentId) });\\n+ };\\n+ const result = await client.toggleLike(contentId);\\n+ assert.deepEqual(calls, ['GET', 'POST']);\\n+ assert.equal(result.liked, false);\\n+ assert.equal(result.engagement.likeCount, 0);\\n+});\\n+\\n+test('batched reads preserve exact comma, Unicode and URL punctuation IDs', async () => {\\n+ const ids = ['paper,a', 'เอกสารไทย&?#/一', 'paper', 'a'];\\n+ global.fetch = async (url) => {\\n+ const params = new URL(url, 'http://localhost').searchParams;\\n+ assert.deepEqual(params.getAll('id'), ids);\\n+ assert.equal(params.get('visitorId'), visitor);\\n+ return Response.json({ items: ids.map((id, index) => stats(id, {\\n+ viewCount: index + 1, likeCount: index === 0 ? 1 : 0, liked: index === 0,\\n+ })) });\\n+ };\\n+ const loaded = await client.loadContentEngagement(ids);\\n+ assert.deepEqual(loaded.map((item) => item.contentId), ids);\\n+ assert.equal(client.getContentEngagement('paper,a').viewCount, 1);\\n+ assert.equal(client.getContentEngagement('เอกสารไทย&?#/一').viewCount, 2);\\n+ assert.equal(client.hasUserLiked('paper,a'), true);\\n+ assert.equal(client.hasUserLiked('paper'), false);\\n+});\\n+\\n+test('view, toggle and download mutations run in order for one document', async () => {\\n+ const view = deferred();\\n+ const calls = [];\\n+ global.fetch = async (url, options) => {\\n+ const action = JSON.parse(options.body).action;\\n+ calls.push(action);\\n+ if (action === 'view') return view.promise;\\n+ return Response.json({ item: stats('paper', {\\n+ viewCount: 1, liked: true, likeCount: 1, downloadCount: action === 'download' ? 1 : 0,\\n+ }) });\\n+ };\\n+ const pendingView = client.incrementViewCount('paper');\\n+ const pendingLike = client.toggleLike('paper');\\n+ const pendingDownload = client.incrementDownloadCount('paper');\\n+ await tick();\\n+ assert.deepEqual(calls, ['view']);\\n+ view.resolve(Response.json({ item: stats('paper', { viewCount: 1 }) }));\\n+ await Promise.all([pendingView, pendingLike, pendingDownload]);\\n+ assert.deepEqual(calls, ['view', 'like', 'download']);\\n+ assert.equal(client.hasUserLiked('paper'), true);\\n+ assert.equal(client.getContentEngagement('paper').downloadCount, 1);\\n+});\\n+\\n+test('a delayed query cannot overwrite a saved like or newer counts', async () => {\\n+ const read = deferred();\\n+ global.fetch = async (url, options) => options?.method === 'POST'\\n+ ? Response.json({ item: stats('paper', { viewCount: 2, liked: true, likeCount: 1 }) })\\n+ : read.promise;\\n+ const pendingRead = client.loadContentEngagement(['paper']);\\n+ await client.incrementViewCount('paper');\\n+ read.resolve(Response.json({ items: [stats('paper', { viewCount: 1 })] }));\\n+ const loaded = await pendingRead;\\n+ assert.equal(client.hasUserLiked('paper'), true);\\n+ assert.equal(client.getContentEngagement('paper').viewCount, 2);\\n+ assert.equal(loaded[0].viewCount, 2);\\n+ assert.equal(loaded[0].likedBy.includes(visitor), true);\\n+});\\n+\\n+test('a query started during a mutation cannot replace its saved response', async () => {\\n+ const write = deferred();\\n+ const read = deferred();\\n+ global.fetch = async (url, options) => options?.method === 'POST' ? write.promise : read.promise;\\n+ const pendingWrite = client.incrementViewCount('paper');\\n+ const pendingRead = client.loadContentEngagement(['paper']);\\n+ write.resolve(Response.json({ item: stats('paper', { viewCount: 2, liked: true, likeCount: 1 }) }));\\n+ await pendingWrite;\\n+ read.resolve(Response.json({ items: [stats('paper', { viewCount: 1 })] }));\\n+ await pendingRead;\\n+ assert.equal(client.hasUserLiked('paper'), true);\\n+ assert.equal(client.getContentEngagement('paper').viewCount, 2);\\n+});\\n+\\n+test('an older query cannot replace the result of a newer query', async () => {\\n+ const oldRead = deferred();\\n+ let reads = 0;\\n+ global.fetch = async () => ++reads === 1 ? oldRead.promise\\n+ : Response.json({ items: [stats('paper', { liked: true, likeCount: 3 })] });\\n+ const pendingOldRead = client.loadContentEngagement(['paper']);\\n+ await client.loadContentEngagement(['paper']);\\n+ oldRead.resolve(Response.json({ items: [stats('paper')] }));\\n+ await pendingOldRead;\\n+ assert.equal(client.hasUserLiked('paper'), true);\\n+ assert.equal(client.getContentEngagement('paper').likeCount, 3);\\n+});\\n+\\n+test('a pending document mutation does not block a different document', async () => {\\n+ const first = deferred();\\n+ const calls = [];\\n+ global.fetch = async (url, options) => {\\n+ const { contentId } = JSON.parse(options.body);\\n+ calls.push(contentId);\\n+ return contentId === 'first' ? first.promise : Response.json({ item: stats(contentId, { viewCount: 1 }) });\\n+ };\\n+ const pendingFirst = client.incrementViewCount('first');\\n+ await client.incrementViewCount('second');\\n+ assert.deepEqual(calls, ['first', 'second']);\\n+ assert.equal(client.getContentEngagement('first').viewCount, 0);\\n+ assert.equal(client.getContentEngagement('second').viewCount, 1);\\n+ first.resolve(Response.json({ item: stats('first', { viewCount: 1 }) }));\\n+ await pendingFirst;\\n+});\\n+\\n+test('a rejected mutation leaves the cache unchanged and does not block the next mutation', async () => {\\n+ let writes = 0;\\n+ global.fetch = async () => ++writes === 1\\n+ ? Response.json({ error: 'Database offline' }, { status: 503 })\\n+ : Response.json({ item: stats('paper', { downloadCount: 1 }) });\\n+ const pendingView = client.incrementViewCount('paper');\\n+ const pendingDownload = client.incrementDownloadCount('paper');\\n+ await assert.rejects(pendingView, /Database offline/);\\n+ assert.equal(client.getContentEngagement('paper').viewCount, 0);\\n+ await pendingDownload;\\n+ assert.equal(client.getContentEngagement('paper').downloadCount, 1);\\n+});\" }, { \"sha\": \"b4d0397b700dc48586b90389af415ba473471bb5\", \"filename\": \"scripts/layout-migration.test.sql\", \"status\": \"added\", \"additions\": 49, \"deletions\": 0, \"changes\": 49, \"blob_url\": \"https://github.com/eurasiaforumsw/Eurasia_webapp-/blob/03564787af6901f8df04064b3c67c3440d306735/scripts%2Flayout-migration.test.sql\", \"raw_url\": \"https://github.com/eurasiaforumsw/Eurasia_webapp-/raw/03564787af6901f8df04064b3c67c3440d306735/scripts%2Flayout-migration.test.sql\", \"contents_url\": \"https://api.github.com/repos/eurasiaforumsw/Eurasia_webapp-/contents/scripts%2Flayout-migration.test.sql?ref=03564787af6901f8df04064b3c67c3440d306735\", \"patch\": \"@@ -0,0 +1,49 @@\\n+-- Run only in an empty disposable PostgreSQL database.\\n+-- psql -v ON_ERROR_STOP=1 -f scripts/layout-migration.test.sql <temporary-database-url>\\n+\\\\set ON_ERROR_STOP on\\n+\\n+DO $$ BEGIN\\n+ IF to_regclass('public.members') IS NOT NULL OR to_regclass('public.layout_config') IS NOT NULL THEN\\n+ RAISE EXCEPTION 'Layout migration tests require an empty disposable database';\\n+ END IF;\\n+ IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon; END IF;\\n+ IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated; END IF;\\n+ IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role BYPASSRLS; END IF;\\n+END $$;\\n+\\n+CREATE SCHEMA IF NOT EXISTS auth;\\n+CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $$ SELECT NULL::UUID $$;\\n+CREATE TABLE public.members (id TEXT PRIMARY KEY, role TEXT NOT NULL DEFAULT 'member');\\n+\\n+-- The documented member schema must support both original layout migrations.\\n+\\\\ir ../supabase/migrations/008_create_layout_config.sql\\n+\\\\ir ../supabase/migrations/013_create_layout_config.sql\\n+INSERT INTO public.members (id, role) VALUES ('member-text-id', 'admin');\\n+UPDATE public.layout_config SET config = '{\\\"heroHeadline\\\":\\\"Persisted heading\\\"}', updated_by = 'member-text-id' WHERE id = 'default';\\n+\\\\ir ../supabase/migrations/028_repair_layout_config.sql\\n+\\\\ir ../supabase/migrations/028_repair_layout_config.sql\\n+\\n+DO $$ BEGIN\\n+ IF (SELECT config->>'heroHeadline' FROM public.layout_config WHERE id = 'default') <> 'Persisted heading' THEN\\n+ RAISE EXCEPTION 'Repair overwrote a saved layout';\\n+ END IF;\\n+ IF has_table_privilege('anon', 'public.layout_config', 'INSERT') OR\\n+ has_table_privilege('authenticated', 'public.layout_config', 'UPDATE') THEN\\n+ RAISE EXCEPTION 'Browser clients can bypass application authorization';\\n+ END IF;\\n+ IF NOT has_table_privilege('service_role', 'public.layout_config', 'UPDATE') OR\\n+ NOT has_table_privilege('anon', 'public.layout_config', 'SELECT') THEN\\n+ RAISE EXCEPTION 'Read/write grants are missing';\\n+ END IF;\\n+END $$;\\n+\\n+-- Also reproduce an installation whose broken initial migration left no table.\\n+DROP TABLE public.layout_config;\\n+\\\\ir ../supabase/migrations/028_repair_layout_config.sql\\n+DO $$ BEGIN\\n+ IF NOT EXISTS (SELECT 1 FROM public.layout_config WHERE id = 'default' AND config = '{}'::jsonb) THEN\\n+ RAISE EXCEPTION 'Repair did not create the missing default layout';\\n+ END IF;\\n+END $$;\\n+\\n+SELECT 'Layout migration tests passed' AS result;\" }, { \"sha\": \"ff49f5cb677c71b5b074feba1fca23b2f85f109b\", \"filename\": \"scripts/site-nav.test.cjs\", \"status\": \"added\", \"additions\": 84, \"deletions\": 0, \"changes\": 84, \"blob_url\": \"https://github.com/eurasiaforumsw/Eurasia_webapp-/blob/03564787af6901f8df04064b3c67c3440d306735/scripts%2Fsite-nav.test.cjs\", \"raw_url\": \"https://github.com/eurasiaforumsw/Eurasia_webapp-/raw/03564787af6901f8df04064b3c67c3440d306735/scripts%2Fsite-nav.test.cjs\", \"contents_url\": \"https://api.github.com/repos/eurasiaforumsw/Eurasia_webapp-/contents/scripts%2Fsite-nav.test.cjs?ref=03564787af6901f8df04064b3c67c3440d306735\", \"patch\": \"@@ -0,0 +1,84 @@\\n+const assert = require('node:assert/strict');\\n+const { test } = require('node:test');\\n+const fs = require('node:fs');\\n+const path = require('node:path');\\n+const Module = require('node:module');\\n+const ts = require('typescript');\\n+\\n+const root = path.resolve(__dirname, '..');\\n+const load = Module._load;\\n+let hooks;\\n+Module._load = function (name, ...args) {\\n+ if (name === 'react') return {\\n+ ...load.call(this, name, ...args),\\n+ useState(initial) {\\n+ const index = hooks.cursor++;\\n+ if (!(index in hooks.state)) hooks.state[index] = initial;\\n+ return [hooks.state[index], (value) => {\\n+ hooks.state[index] = typeof value === 'function' ? value(hooks.state[index]) : value;\\n+ }];\\n+ },\\n+ useRef() { return { current: null }; },\\n+ useCallback(callback) { return callback; },\\n+ useEffect() {},\\n+ };\\n+ if (name === 'next/navigation') return { usePathname: () => '/academic-documents' };\\n+ if (name === 'next/link') return { __esModule: true, default: 'a' };\\n+ if (name === 'framer-motion') return { motion: (component) => component };\\n+ if (name === '@/contexts/I18nContext') return {\\n+ useI18n: () => ({ locale: 'en', setLocale() {}, t: (key) => key }),\\n+ };\\n+ if (name === '@/hooks/useClickOutside') return { useClickOutside() {} };\\n+ if (name === '@/lib/admin-auth') return { ADMIN_SESSION_KEY: 'admin-session' };\\n+ if (name === '@/lib/member-auth') return { MEMBER_SESSION_KEY: 'member-session' };\\n+ if (name === '@/components/efsw/MemberMenu') return { MemberMenu() {} };\\n+ return load.call(this, name, ...args);\\n+};\\n+require.extensions['.tsx'] = (module, filename) => module._compile(ts.transpileModule(\\n+ fs.readFileSync(filename, 'utf8'),\\n+ { compilerOptions: { module: ts.ModuleKind.CommonJS, target: ts.ScriptTarget.ES2020,\\n+ jsx: ts.JsxEmit.ReactJSX, esModuleInterop: true } },\\n+).outputText, filename);\\n+\\n+const { SiteNav } = require('../components/efsw/SiteNav.tsx');\\n+function findElement(element, matches) {\\n+ if (!element || typeof element !== 'object') return null;\\n+ if (matches(element)) return element;\\n+ for (const child of [].concat(element.props?.children || [])) {\\n+ const found = findElement(child, matches);\\n+ if (found) return found;\\n+ }\\n+ return null;\\n+}\\n+\\n+test('mobile navigation is inert while closed and becomes a modal only after opening', () => {\\n+ hooks = { state: [], cursor: 0 };\\n+ const render = () => { hooks.cursor = 0; return SiteNav(); };\\n+ const sheet = (tree) => findElement(tree, (element) => element.props?.id === 'efsw-mobile-menu');\\n+ const dialog = (tree) => findElement(tree, (element) => element.props?.role === 'dialog');\\n+ const toggle = (tree) => findElement(tree, (element) => element.props?.['aria-controls'] === 'efsw-mobile-menu');\\n+ const sheetElement = { inert: false };\\n+\\n+ const closed = render();\\n+ sheet(closed).ref?.(sheetElement);\\n+ assert.equal(sheetElement.inert, true);\\n+ assert.equal(sheet(closed).props['aria-hidden'], true);\\n+ assert.equal(dialog(closed).props['aria-modal'], undefined);\\n+ assert.equal(toggle(closed).props['aria-expanded'], false);\\n+\\n+ global.window = { clearTimeout() {} };\\n+ toggle(closed).props.onClick();\\n+ const opened = render();\\n+ sheet(opened).ref?.(sheetElement);\\n+ assert.equal(sheetElement.inert, false);\\n+ assert.equal(sheet(opened).props['aria-hidden'], false);\\n+ assert.equal(dialog(opened).props['aria-modal'], true);\\n+ assert.equal(toggle(opened).props['aria-expanded'], true);\\n+\\n+ findElement(opened, (element) => element.props?.className === 'efsw-sheet__scrim').props.onClick();\\n+ const dismissed = render();\\n+ sheet(dismissed).ref?.(sheetElement);\\n+ assert.equal(sheetElement.inert, true);\\n+ assert.equal(sheet(dismissed).props['aria-hidden'], true);\\n+ assert.equal(dialog(dismissed).props['aria-modal'], undefined);\\n+});\" }, { \"sha\": \"07205b9a2608d76a97d4e8f68a20c1fb3debdc98\", \"filename\": \"supabase/migrations/008_create_layout_config.sql\", \"status\": \"modified\", \"additions\": 7, \"deletions\": 4, \"changes\": 11, \"blob_url\": \"https://github.com/eurasiaforumsw/Eurasia_webapp-/blob/03564787af6901f8df04064b3c67c3440d306735/supabase%2Fmigrations%2F008_create_layout_config.sql\", \"raw_url\": \"https://github.com/eurasiaforumsw/Eurasia_webapp-/raw/03564787af6901f8df04064b3c67c3440d306735/supabase%2Fmigrations%2F008_create_layout_config.sql\", \"contents_url\": \"https://api.github.com/repos/eurasiaforumsw/Eurasia_webapp-/contents/supabase%2Fmigrations%2F008_create_layout_config.sql?ref=03564787af6901f8df04064b3c67c3440d306735\", \"patch\": \"@@ -9,41 +9,44 @@ CREATE TABLE IF NOT EXISTS layout_config (\\n id TEXT PRIMARY KEY DEFAULT 'default',\\n config JSONB NOT NULL,\\n updated_at TIMESTAMPTZ DEFAULT NOW(),\\n- updated_by UUID REFERENCES members(id)\\n+ updated_by TEXT REFERENCES members(id)\\n );\\n \\n -- Create index on updated_at\\n-CREATE INDEX idx_layout_config_updated_at ON layout_config(updated_at DESC);\\n+CREATE INDEX IF NOT EXISTS idx_layout_config_updated_at ON layout_config(updated_at DESC);\\n \\n -- Enable RLS\\n ALTER TABLE layout_config ENABLE ROW LEVEL SECURITY;\\n \\n -- RLS Policy: Public can read layout config\\n+DROP POLICY IF EXISTS \\\"Public can view layout config\\\" ON layout_config;\\n CREATE POLICY \\\"Public can view layout config\\\"\\n ON layout_config\\n FOR SELECT\\n USING (true);\\n \\n -- RLS Policy: Only admins can update layout config\\n+DROP POLICY IF EXISTS \\\"Admins can update layout config\\\" ON layout_config;\\n CREATE POLICY \\\"Admins can update layout config\\\"\\n ON layout_config\\n FOR UPDATE\\n USING (\\n EXISTS (\\n SELECT 1 FROM members\\n- WHERE members.id = auth.uid()\\n+ WHERE members.id = auth.uid()::text\\n AND members.role = 'admin'\\n )\\n );\\n \\n -- RLS Policy: Only admins can insert layout config\\n+DROP POLICY IF EXISTS \\\"Admins can insert layout config\\\" ON layout_config;\\n CREATE POLICY \\\"Admins can insert layout config\\\"\\n ON layout_config\\n FOR INSERT\\n WITH CHECK (\\n EXISTS (\\n SELECT 1 FROM members\\n- WHERE members.id = auth.uid()\\n+ WHERE members.id = auth.uid()::text\\n AND members.role = 'admin'\\n )\\n );\" }, { \"sha\": \"40470e97cf07830717f07e7b57e70756011174da\", \"filename\": \"supabase/migrations/013_create_layout_config.sql\", \"status\": \"modified\", \"additions\": 6, \"deletions\": 3, \"changes\": 9, \"blob_url\": \"https://github.com/eurasiaforumsw/Eurasia_webapp-/blob/03564787af6901f8df04064b3c67c3440d306735/supabase%2Fmigrations%2F013_create_layout_config.sql\", \"raw_url\": \"https://github.com/eurasiaforumsw/Eurasia_webapp-/raw/03564787af6901f8df04064b3c67c3440d306735/supabase%2Fmigrations%2F013_create_layout_config.sql\", \"contents_url\": \"https://api.github.com/repos/eurasiaforumsw/Eurasia_webapp-/contents/supabase%2Fmigrations%2F013_create_layout_config.sql?ref=03564787af6901f8df04064b3c67c3440d306735\", \"patch\": \"@@ -9,7 +9,7 @@ CREATE TABLE IF NOT EXISTS layout_config (\\n id TEXT PRIMARY KEY DEFAULT 'default',\\n config JSONB NOT NULL,\\n updated_at TIMESTAMPTZ DEFAULT NOW(),\\n- updated_by UUID REFERENCES members(id) ON DELETE SET NULL\\n+ updated_by TEXT REFERENCES members(id) ON DELETE SET NULL\\n );\\n \\n -- Insert default config (will be populated from code)\\n@@ -25,31 +25,34 @@ ON layout_config(updated_at DESC);\\n ALTER TABLE layout_config ENABLE ROW LEVEL SECURITY;\\n \\n -- RLS Policy: Anyone can read layout config (for public site)\\n+DROP POLICY IF EXISTS \\\"Anyone can view layout config\\\" ON layout_config;\\n CREATE POLICY \\\"Anyone can view layout config\\\"\\n ON layout_config\\n FOR SELECT\\n USING (true);\\n \\n -- RLS Policy: Only admins can update layout config\\n+DROP POLICY IF EXISTS \\\"Admins can update layout config\\\" ON layout_config;\\n CREATE POLICY \\\"Admins can update layout config\\\"\\n ON layout_config\\n FOR UPDATE\\n USING (\\n EXISTS (\\n SELECT 1 FROM members\\n- WHERE members.id = auth.uid()\\n+ WHERE members.id = auth.uid()::text\\n AND members.role = 'admin'\\n )\\n );\\n \\n -- RLS Policy: Only admins can insert layout config\\n+DROP POLICY IF EXISTS \\\"Admins can insert layout config\\\" ON layout_config;\\n CREATE POLICY \\\"Admins can insert layout config\\\"\\n ON layout_config\\n FOR INSERT\\n WITH CHECK (\\n EXISTS (\\n SELECT 1 FROM members\\n- WHERE members.id = auth.uid()\\n+ WHERE members.id = auth.uid()::text\\n AND members.role = 'admin'\\n )\\n );\" }, { \"sha\": \"86eaf9ce80b678c5d4bf018d4e399dbfd3ffc919\", \"filename\": \"supabase/migrations/028_repair_layout_config.sql\", \"status\": \"added\", \"additions\": 30, \"deletions\": 0, \"changes\": 30, \"blob_url\": \"https://github.com/eurasiaforumsw/Eurasia_webapp-/blob/03564787af6901f8df04064b3c67c3440d306735/supabase%2Fmigrations%2F028_repair_layout_config.sql\", \"raw_url\": \"https://github.com/eurasiaforumsw/Eurasia_webapp-/raw/03564787af6901f8df04064b3c67c3440d306735/supabase%2Fmigrations%2F028_repair_layout_config.sql\", \"contents_url\": \"https://api.github.com/repos/eurasiaforumsw/Eurasia_webapp-/contents/supabase%2Fmigrations%2F028_repair_layout_config.sql?ref=03564787af6901f8df04064b3c67c3440d306735\", \"patch\": \"@@ -0,0 +1,30 @@\\n+-- Earlier layout migrations used UUID references to TEXT members.id and could\\n+-- fail before creating this table. Preserve saved config when repairing it.\\n+BEGIN;\\n+\\n+CREATE TABLE IF NOT EXISTS public.layout_config (\\n+ id TEXT PRIMARY KEY DEFAULT 'default',\\n+ config JSONB NOT NULL DEFAULT '{}'::jsonb,\\n+ updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),\\n+ updated_by TEXT REFERENCES public.members(id) ON DELETE SET NULL\\n+);\\n+\\n+CREATE INDEX IF NOT EXISTS idx_layout_config_updated_at ON public.layout_config(updated_at DESC);\\n+INSERT INTO public.layout_config (id, config) VALUES ('default', '{}'::jsonb)\\n+ON CONFLICT (id) DO NOTHING;\\n+\\n+ALTER TABLE public.layout_config ENABLE ROW LEVEL SECURITY;\\n+DROP POLICY IF EXISTS \\\"Public can view layout config\\\" ON public.layout_config;\\n+DROP POLICY IF EXISTS \\\"Anyone can view layout config\\\" ON public.layout_config;\\n+DROP POLICY IF EXISTS \\\"Admins can update layout config\\\" ON public.layout_config;\\n+DROP POLICY IF EXISTS \\\"Admins can insert layout config\\\" ON public.layout_config;\\n+CREATE POLICY \\\"Public can view layout config\\\" ON public.layout_config\\n+ FOR SELECT TO anon, authenticated USING (true);\\n+\\n+-- Writes use application JWT authorization in /api/layout and its service key.\\n+REVOKE ALL ON public.layout_config FROM PUBLIC, anon, authenticated;\\n+GRANT SELECT ON public.layout_config TO anon, authenticated;\\n+GRANT SELECT, INSERT, UPDATE, DELETE ON public.layout_config TO service_role;\\n+\\n+NOTIFY pgrst, 'reload schema';\\n+COMMIT;\" }, { \"sha\": \"15756cb380c1f17917947d62508352bcc1e9a5e1\", \"filename\": \"vercel.json\", \"status\": \"added\", \"additions\": 4, \"deletions\": 0, \"changes\": 4, \"blob_url\": \"https://github.com/eurasiaforumsw/Eurasia_webapp-/blob/03564787af6901f8df04064b3c67c3440d306735/vercel.json\", \"raw_url\": \"https://github.com/eurasiaforumsw/Eurasia_webapp-/raw/03564787af6901f8df04064b3c67c3440d306735/vercel.json\", \"contents_url\": \"https://api.github.com/repos/eurasiaforumsw/Eurasia_webapp-/contents/vercel.json?ref=03564787af6901f8df04064b3c67c3440d306735\", \"patch\": \"@@ -0,0 +1,4 @@\\n+{\\n+ \\\"$schema\\\": \\\"https://openapi.vercel.sh/vercel.json\\\",\\n+ \\\"buildCommand\\\": \\\"npm run build && node scripts/check-built-styles.cjs\\\"\\n+}\" } ] }"